spring.application.name=callback-backend

# H2 fichier : les demandes survivent aux redémarrages (dossier ./data relatif au répertoire de lancement)
spring.datasource.url=jdbc:h2:file:./data/callback
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.same-site=lax
